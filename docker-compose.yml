services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crochet
      POSTGRES_PASSWORD: crochet
      POSTGRES_DB: crochet_sim
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crochet -d crochet_sim"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-style app container — opt in with:
  #   docker compose --profile app up -d --build
  # (dev flow stays `docker compose up -d db` + `npm run dev`)
  #
  # The Next.js app (and its Prisma schema) live under web/, so build
  # context is scoped there — but the compiled WASM bridge (wasm/src/lib.rs
  # -> web/lib/wasm/) is regenerated by a manual step and committed to git
  # (see README.md), not rebuilt by Docker. If core/ or wasm/ changed,
  # rebuild and commit the WASM bindings *before* deploying — this compose
  # file never touches the Rust toolchain at all.

  migrate:
    profiles: ["app"]
    build:
      context: ./web
      target: build
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crochet:crochet@db:5432/crochet_sim

  app:
    profiles: ["app"]
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://crochet:crochet@db:5432/crochet_sim
    ports:
      - "127.0.0.1:30020:3000"

volumes:
  db-data:
